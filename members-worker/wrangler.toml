name = "eicc-members"
main = "src/index.js"
compatibility_date = "2026-07-01"

# Pin the account explicitly rather than letting wrangler resolve it.
# Not a secret — it appears in every Cloudflare dashboard URL — and this
# file is excluded from the public asset upload by ../.assetsignore.
#
# Added 13 Aug 2026 after the third Cloudflare auth cycle this project
# has lost time to. Without it, a stale OAuth session or an ambiguity
# between accounts surfaces as "the given account is not valid or is not
# authorized" (API error 7403) part-way through a migration run, which
# reads like a broken migration. It is not: the replay has already
# validated by that point and nothing is wrong with the SQL. Naming the
# account here makes the failure say what it actually is.
account_id = "40864d5884a283ec93dddf45fc9ebe32"

# ----------------------------------------------------------------
# Non-secret configuration. Fill these in before deploying.
# ----------------------------------------------------------------
[vars]
# The public URL this Worker will be reachable at once deployed —
# e.g. a workers.dev subdomain to start, or your own custom domain
# once you route it (Cloudflare Dashboard → Workers → Triggers).
SITE_URL = "https://members.e-invoicingcompliancecorner.com"

# The "from" address for magic-link emails.
# Using Resend's shared sandbox domain for now — this works without any
# domain verification, but can only send TO the email address you signed
# up to Resend with (fine for testing). Once you have a real domain,
# verify it in Resend and change this to something like
# "newsletter@yourdomain.com".
FROM_EMAIL = "noreply@e-invoicingcompliancecorner.com"

# The Lemon Squeezy variant ID for your ONE-TIME (non-recurring)
# product — find this in Lemon Squeezy: Products → your one-time
# product → the variant's ID shown in the URL or via the API.
# Leave as-is if you haven't set up the one-time tier yet.
ONE_TIME_VARIANT_ID = "1962239"

# Temporary promo toggle (added 2 August 2026): while "true", the
# newsletter archive (/members/archive and /members/archive/:slug) is
# viewable by anyone, with no login or active subscription required —
# a deliberate, time-limited exception to the normal requireSession()
# gate, to build page traffic. Anonymous visitors see a "free for a
# limited time, subscribe for alerts" banner instead of the usual
# "Signed in as ___" line; real subscribers who ARE logged in still
# see their normal signed-in view either way.
#
# To end the promo: set this to "false" (or delete the line) and run
# `wrangler deploy` again. You can also flip it in the Cloudflare
# dashboard (Workers & Pages → eicc-members → Settings → Variables)
# for an IMMEDIATE effect with no redeploy — but note the next time
# anyone runs `wrangler deploy` from this repo, it will resync from
# whatever value is written here, overwriting a dashboard-only change.
# So a dashboard toggle is fine for a quick end-of-day flip, but if
# you want it to stick permanently, update this file too.
ARCHIVE_PUBLIC = "true"

# Where the content-monitor digest is sent (nightly since 24 Aug 2026). This is an INTERNAL
# operator email only -- raw "these government pages changed, go look"
# material, never sent to subscribers. See CONTENT-MONITORING.md.
CONTENT_MONITOR_EMAIL = "einvoicingcompliancecorner@gmail.com"

# ----------------------------------------------------------------
# KV namespaces — create these with `wrangler kv namespace create`
# (see README, Step 2) and paste the IDs it gives you back here.
# ----------------------------------------------------------------
[[kv_namespaces]]
binding = "SUBSCRIBERS"
id = "5a7d9f86169a4e16852e914346568a9a"

# CONTENT_MONITOR: snapshot hashes for the nightly "known-page watcher"
# (CONTENT-MONITORING.md). Deliberately a SEPARATE namespace from
# SUBSCRIBERS -- this stores page-content hashes for monitoring, not
# subscriber data, and the two shouldn't share a keyspace. One-time
# setup: `wrangler kv namespace create CONTENT_MONITOR`, then paste the
# id it prints below.
[[kv_namespaces]]
binding = "CONTENT_MONITOR"
id = "e028dfd040f64c72a0110bac13b233cf"

# NOTE: the old ISSUES KV binding was removed here — the monthly
# notification job and the archive both now read from D1 (see
# D1-MIGRATION-PLAN.md and NEWSLETTER-ARCHIVE-REDESIGN.md). Removing
# this binding does NOT delete the underlying KV namespace or its data
# in your Cloudflare account — it just stops this Worker from having
# access to it. If you want to fully clean up the old data too, that's
# a separate step: `wrangler kv namespace list` to find its ID, then
# `wrangler kv namespace delete --namespace-id=<id>`.

# ----------------------------------------------------------------
# D1 database — translations (tracker, subscribe, education pages,
# country deep dives) and newsletter story content. See
# D1-MIGRATION-PLAN.md and NEWSLETTER-ARCHIVE-REDESIGN.md for the full
# design. Actively used by the archive routes and the monthly
# notification job (env.eicc_content in src/index.js), and also used
# directly by the build-time translation-generation script via
# `wrangler d1 execute`.
# ----------------------------------------------------------------
[[d1_databases]]
binding = "eicc_content"
database_name = "eicc-content"
database_id = "d1d10bd0-e90a-44a3-9494-a63689e8d32e"

# ----------------------------------------------------------------
# Cron Trigger — fires the scheduled() handler in src/index.js once
# a month, which emails every active subscriber a list of that
# month's newsletter stories — either just the ones matching their
# saved country preferences, or the full month's list if they haven't
# set any preference.
# Schedule below: 09:00 UTC on the 1st of every month.
# ----------------------------------------------------------------
[triggers]
# Two independent schedules on the same Worker -- scheduled() in
# src/index.js tells them apart via event.cron:
#   "0 9 1 * *"  -- 09:00 UTC on the 1st of every month: the monthly
#                   subscriber notification job (unchanged, pre-existing)
#   "0 8 * * *"  -- 08:00 UTC DAILY: the content monitor. Was Mondays
#                   until 24 Aug 2026, when migration 635 widened its
#                   watch list from 140 curated pages to the 758 URLs
#                   the site actually cites. That does not fit one run,
#                   so it runs nightly and continues from a cursor --
#                   a full sweep every three days rather than one a
#                   week. See CONTENT-MONITORING.md.
crons = ["0 9 1 * *", "0 8 * * *"]

# ----------------------------------------------------------------
# Secrets are NOT set here — never put real secrets in this file,
# since it may end up in version control. Set them with:
#   wrangler secret put LEMONSQUEEZY_WEBHOOK_SECRET
#   wrangler secret put SESSION_SECRET
#   wrangler secret put RESEND_API_KEY
# (see README, Step 3)
# ----------------------------------------------------------------
