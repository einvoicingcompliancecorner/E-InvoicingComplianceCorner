# ----------------------------------------------------------------
# This Worker serves the public site at e-invoicingcompliancecorner.com.
# It is a Cloudflare "Workers with static assets" project (NOT Cloudflare
# Pages) — the existing production resource is named "eicc-public" (renamed from its
# auto-generated "winter-fog-ff16" default)
# and was originally created via a manual dashboard upload with no git
# connection, so `name` below must stay "eicc-public" for
# `wrangler deploy` to update that same resource rather than creating a
# new one.
#
# Deploy with:
#   cd site-worker
#   wrangler deploy
#
# (same pattern as members-worker — run from your own machine, since
# this sandbox can't reach the Cloudflare API directly.)
# ----------------------------------------------------------------
name = "eicc-public"
main = "src/index.js"
compatibility_date = "2026-08-02"

# Same account as members-worker; see that file's note for why this is
# written down rather than resolved. Not a secret, and this file is
# excluded from the public asset upload by ../.assetsignore.
account_id = "40864d5884a283ec93dddf45fc9ebe32"

# Static assets — everything in the repo root (index.html, the tracker,
# education pages, i18n/, etc.) except what's excluded in
# ../.assetsignore (this site-worker/ dir itself, members-worker/,
# shared/, docs, git metadata).
[assets]
directory = "../"
binding = "ASSETS"
# CRITICAL for the dynamic tracker (Stage 5): by default, requests whose
# URL matches an existing asset file are served directly by the asset
# layer and the Worker NEVER RUNS — which is why the tracker silently
# served its static snapshot on every request while the deep-dive pages
# (which match no asset file) rendered dynamically fine. These paths are
# routed worker-first so renderTracker / renderTrackerDataJson actually
# execute; everything else keeps fast direct asset serving. The glob
# covers both /einvoicing-compliance-tracker.html and the extensionless
# form the asset layer canonicalizes to.
run_worker_first = [
  # "/" IS THE TRACKER FROM 25 AUGUST 2026, and this line is the whole
  # reason it works. index.html is still an asset at the root, so without
  # this entry the asset layer answers `/` with the old redirect stub and
  # renderTracker never runs — no error, no log, just the front door
  # quietly reverting to what it was. That is the same silent failure
  # described immediately above, on the page it would hurt most.
  #
  # Matches the root path only; every other asset keeps direct serving.
  # tests/seo-crawlability.mjs reads THIS FILE and fails if the entry
  # disappears, because nothing else in the repository would notice.
  "/",
  "/einvoicing-compliance-tracker*",
  "/i18n/es-data.json",
  "/i18n/de-data.json",
  "/i18n/fr-data.json",
]

# Same D1 database members-worker already uses — country deep-dive
# content, translations, tracker milestones, mandate summaries, etc.
[[d1_databases]]
binding = "eicc_content"
database_name = "eicc-content"
database_id = "d1d10bd0-e90a-44a3-9494-a63689e8d32e"

# ----------------------------------------------------------------
# ROI & Wave Planner (added 11 Aug 2026; ROI_PUBLIC turned on 19 Aug).
#
# Two separate switches on purpose:
#   ROI_PUBLIC     — is the page reachable at all
#   ROI_INDEXABLE  — may search engines index it once it IS reachable
# Turning the page on does not silently also invite Google in; a
# half-tested tool appearing in search results is hard to undo.
#
# ROI_PUBLIC WENT TRUE ON 19 AUGUST, because Dan asked for the planner in
# the Resources menu marked "(Beta)". Until then the route answered 404
# by design — his 11 August instruction was to keep it off the public
# site while he road-tested the output, and it stayed off through
# fourteen migrations of exactly that.
#
# IT WAS NOT TURNED ON WHEN THE MENU ITEM WAS BUILT, which is how the
# first click produced a bare "Not found" filling the panel. The link and
# this flag were one change shipped as two. No suite could have caught
# it: the harness calls renderRoiCalculatorPage() directly and never goes
# through the router that reads this file, so every check passed against
# a page the public site was still refusing to serve.
#
# ROI_INDEXABLE STAYS FALSE, and "(Beta)" is the whole argument. Being
# reachable by anyone who opens the Resources menu is a different
# decision from wanting it in search results while it still carries a
# beta marker. The page emits noindex,nofollow until this flips.
#
# Remember to add /roi-calculator to sitemap.xml when ROI_INDEXABLE goes
# true as well. It is deliberately NOT there yet: a sitemap entry for a
# noindex page is an instruction and its own contradiction.
# ----------------------------------------------------------------
# ----------------------------------------------------------------
# Service binding to members-worker, added 20 August 2026.
#
# The planner needs a signed-in reader's saved countries, and this Worker
# deliberately has no subscribers binding. So it asks: it forwards the
# reader's own cookie to /members/api/saved-countries, which authenticates
# the READER rather than the caller — there is no email parameter, so a
# caller cannot ask for somebody else's list.
#
# members-worker stays the only thing that reads an account. That boundary
# is not absolute (this Worker holds SESSION_SECRET, which can mint a
# token for any address) but it is real against accidents: a bug on a
# public page can leak what this Worker holds and cannot forge a session
# and go querying the other one.
#
# BOTH WORKERS MUST BE DEPLOYED for this to resolve. If the binding is
# missing the planner still renders — the saved-countries control simply
# disables itself with an honest label. Fails soft on purpose.
[[services]]
binding = "MEMBERS"
service = "eicc-members"
# ----------------------------------------------------------------

[vars]
ROI_PUBLIC = "true"
ROI_INDEXABLE = "false"

# ----------------------------------------------------------------
# SEARCH ENGINE OWNERSHIP VERIFICATION — paste the token, redeploy.
#
# Both are EMPTY on purpose and emit nothing while they are. A
# `<meta content="">` is worse than no tag at all: the engine reads it,
# fails the check, and records the property as claimed-but-invalid.
#
# NEITHER IS A SECRET. Both are published in the HTML of the home page by
# design — that is how the check works. They are vars rather than
# literals in index.js so that claiming the property is a config edit
# rather than a code change.
#
# GOOGLE: Search Console → Add property → URL prefix →
#   https://e-invoicingcompliancecorner.com/ → "HTML tag". Copy ONLY the
#   content="..." value, not the whole tag. Deploy, then press Verify.
#
# BING: Bing Webmaster Tools → Add site → "Meta tag", same rule. Worth
# doing beside Google rather than instead of it: Bing's index is what
# several assistant products query when they search, so being absent
# from it is an absence from a discovery surface and not just from a
# search engine.
#
# DNS IS THE BETTER METHOD IF YOU HAVE THE CHOICE. A TXT record on the
# apex verifies every subdomain at once (including the members host),
# survives every deploy, and cannot be dropped by an edit to the tracker
# markup — which this tag can. Cloudflare hosts this zone's DNS, so it is
# a two-minute dashboard change. Use these two only if you are already
# standing in the "HTML tag" dialog.
GOOGLE_SITE_VERIFICATION = ""
BING_SITE_VERIFICATION = ""

# ----------------------------------------------------------------
# SESSION_SECRET — a SECRET, not a var. Deliberately not written here.
#
# Set it once, from your own machine, to the SAME value members-worker
# already uses (otherwise this Worker will reject every valid session and
# nobody will ever appear signed in on the public site):
#
#     cd site-worker
#     npx wrangler secret put SESSION_SECRET
#
# WHAT THIS WORKER CAN DO WITH IT, and what it cannot. The session token
# is a self-contained HMAC, so the secret lets this Worker verify WHO a
# reader is. It is given no subscribers binding, so it cannot read or
# change anything about their account — every entitlement decision stays
# on members-worker. See shared/session.mjs for the full reasoning and
# the trade it accepts.
#
# If the secret is absent, sessionEmail() returns null and the site
# behaves exactly as it did before: nobody is recognised, the planner
# gates as normal. That is a deliberate fail-closed, so a missed secret
# is a feature that does not appear rather than a site that breaks.
# ----------------------------------------------------------------
