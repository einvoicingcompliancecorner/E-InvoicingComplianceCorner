# ----------------------------------------------------------------
# This Worker serves the public site at e-invoicingcompliancecorner.com.
# It is a Cloudflare "Workers with static assets" project (NOT Cloudflare
# Pages) — the existing production resource is named "eicc-public" (renamed from its
# auto-generated "winter-fog-ff16" default)
# and was originally created via a manual dashboard upload with no git
# connection, so `name` below must stay "eicc-public" for
# `wrangler deploy` to update that same resource rather than creating a
# new one.
#
# Deploy with:
#   cd site-worker
#   wrangler deploy
#
# (same pattern as members-worker — run from your own machine, since
# this sandbox can't reach the Cloudflare API directly.)
# ----------------------------------------------------------------
name = "eicc-public"
main = "src/index.js"
compatibility_date = "2026-08-02"

# Static assets — everything in the repo root (index.html, the tracker,
# education pages, i18n/, etc.) except what's excluded in
# ../.assetsignore (this site-worker/ dir itself, members-worker/,
# shared/, docs, git metadata).
[assets]
directory = "../"
binding = "ASSETS"
# CRITICAL for the dynamic tracker (Stage 5): by default, requests whose
# URL matches an existing asset file are served directly by the asset
# layer and the Worker NEVER RUNS — which is why the tracker silently
# served its static snapshot on every request while the deep-dive pages
# (which match no asset file) rendered dynamically fine. These paths are
# routed worker-first so renderTracker / renderTrackerDataJson actually
# execute; everything else keeps fast direct asset serving. The glob
# covers both /einvoicing-compliance-tracker.html and the extensionless
# form the asset layer canonicalizes to.
run_worker_first = [
  "/einvoicing-compliance-tracker*",
  "/i18n/es-data.json",
  "/i18n/de-data.json",
  "/i18n/fr-data.json",
]

# Same D1 database members-worker already uses — country deep-dive
# content, translations, tracker milestones, mandate summaries, etc.
[[d1_databases]]
binding = "eicc_content"
database_name = "eicc-content"
database_id = "d1d10bd0-e90a-44a3-9494-a63689e8d32e"
